name: Basic SH CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-shell-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Give Permission to Script
        run: chmod +x script.sh

      - name: Run Shell Script
        run: ./script.sh
